name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-validation:
    name: Clean validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Run complete validation suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/run_validation.py

      - name: Assert validation left tracked and non-ignored files clean
        if: ${{ always() }}
        shell: bash
        run: |
          tracked_evidence="$(git ls-files -- VALIDATION_SUMMARY.txt validation/FULL_VALIDATION_RUN.txt validation/VALIDATION_STATE.json validation/evidence)"
          if [[ -n "$tracked_evidence" ]]; then
            printf 'Generated validation evidence must not be tracked:\n%s\n' "$tracked_evidence"
            exit 1
          fi
          git diff --exit-code --stat
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-evidence-${{ github.run_id }}
          path: |
            VALIDATION_SUMMARY.txt
            validation/FULL_VALIDATION_RUN.txt
            validation/VALIDATION_STATE.json
            validation/evidence/
          if-no-files-found: warn
          retention-days: 7
